name: CI (fast compile)

# Runs the shared KMP test and compile gate on pull requests and protected
# branches. Release artifacts remain the responsibility of Task 14.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run shared tests and compile targets
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon check :composeApp:compileKotlinJvm :composeApp:compileKotlinJs 2>&1 | tee /tmp/build.log || {
            echo "=================== KOTLIN COMPILE ERRORS ==================="
            grep -E '^e: ' /tmp/build.log | head -40
            echo "==========================================================="
            exit 1
          }
